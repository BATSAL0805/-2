<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>화투 머니판</title>
<style>
  :root {
    --bg: #0b3d2e;
    --bg-deep: #072a20;
    --card: #103f30;
    --card-line: #1d5a45;
    --gold: #f2c14e;
    --gold-deep: #d9a72e;
    --text: #f4f1e8;
    --text-dim: #a9c4b8;
    --up: #6fe08a;
    --down: #ff8a8a;
    --danger: #e05d5d;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at 50% 0%, var(--bg) 0%, var(--bg-deep) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 16px 16px 32px;
    display: flex;
    flex-direction: column;
  }
  .hidden { display: none !important; }

  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 17px; margin: 0 0 12px; color: var(--gold); }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px 16px;
  }
  .topbar .logo { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; display:flex; align-items:center; gap:6px; }
  .topbar .actions { display: flex; gap: 8px; }

  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    padding: 12px 16px;
    min-height: 48px;
    transition: transform .08s ease, opacity .12s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--gold); color: #23200f; }
  .btn-primary:disabled { opacity: 0.4; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--card-line); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text-dim); font-weight: 600; }
  .btn-block { width: 100%; }
  .btn-sm { min-height: 38px; padding: 8px 12px; font-size: 13px; border-radius: 10px; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .section { margin-bottom: 18px; }

  /* ---- setup screen ---- */
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    flex: 1 1 auto;
    min-width: 52px;
    text-align: center;
    padding: 12px 6px;
    border-radius: 12px;
    background: var(--bg-deep);
    border: 1px solid var(--card-line);
    color: var(--text-dim);
    font-weight: 700;
    font-size: 15px;
  }
  .chip.active {
    background: var(--gold);
    color: #23200f;
    border-color: var(--gold);
  }
  .field-label { font-size: 13px; color: var(--text-dim); margin: 14px 0 8px; font-weight: 600; }
  .field-label:first-child { margin-top: 0; }
  input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--bg-deep);
    border: 1px solid var(--card-line);
    border-radius: 12px;
    color: var(--text);
    font-size: 16px;
    padding: 12px 14px;
    font-family: inherit;
  }
  input:focus { outline: 2px solid var(--gold); }
  .player-name-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .player-name-row .num {
    width: 28px;
    height: 28px;
    flex: none;
    border-radius: 50%;
    background: var(--bg-deep);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
  }
  .error-text { color: var(--down); font-size: 13px; margin-top: 8px; }

  /* ---- game screen ---- */
  .player-grid { display: flex; flex-direction: column; gap: 10px; }
  .player-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: var(--radius);
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .player-card.leader {
    border-color: var(--gold);
    background: linear-gradient(135deg, #1c4d3a, #123b2c);
  }
  .player-card .pname { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .player-card .pmoney { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .player-card .pdelta {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 12px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 100px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .25s ease, transform .25s ease;
  }
  .player-card .pdelta.show { opacity: 1; transform: translateY(0); }
  .pdelta.up { background: rgba(111,224,138,0.18); color: var(--up); }
  .pdelta.down { background: rgba(255,138,138,0.18); color: var(--down); }

  .action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 16px 0;
  }

  .history-preview { display: flex; flex-direction: column; gap: 8px; }
  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: var(--bg-deep);
    border-radius: 10px;
    font-size: 13px;
  }
  .history-item .h-desc { color: var(--text-dim); }
  .history-item .h-desc b { color: var(--text); }
  .history-item .h-amount { font-weight: 800; font-variant-numeric: tabular-nums; }
  .history-item .h-time { color: var(--text-dim); font-size: 11px; margin-right: 8px; }
  .empty-note { color: var(--text-dim); font-size: 13px; text-align: center; padding: 18px 0; }

  /* ---- modal ---- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-backdrop.center { align-items: center; padding: 20px; }
  .modal-sheet {
    background: var(--bg);
    border: 1px solid var(--card-line);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .modal-backdrop.center .modal-sheet {
    border-radius: 18px;
    max-height: 80vh;
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .modal-head h2 { margin: 0; }
  .close-x {
    background: var(--card);
    color: var(--text-dim);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .select-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .select-pill {
    padding: 10px 14px;
    border-radius: 100px;
    background: var(--bg-deep);
    border: 1px solid var(--card-line);
    color: var(--text-dim);
    font-weight: 700;
    font-size: 14px;
  }
  .select-pill.active { background: var(--gold); color: #23200f; border-color: var(--gold); }
  .select-pill:disabled { opacity: 0.3; }

  .amount-quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .amount-quick .chip { flex: none; padding: 8px 12px; font-size: 13px; min-width: auto; }

  .toggle-row { display: flex; gap: 8px; }
  .toggle-row .select-pill { flex: 1; text-align: center; font-size: 15px; padding: 12px; }
  .toggle-row .select-pill.plus.active { background: var(--up); color: #0c3320; border-color: var(--up); }
  .toggle-row .select-pill.minus.active { background: var(--down); color: #3a0c0c; border-color: var(--down); }

  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; }

  /* ---- result screen ---- */
  .result-title { text-align: center; margin: 8px 0 20px; }
  .result-title .trophy { font-size: 42px; }
  .rank-list { display: flex; flex-direction: column; gap: 10px; }
  .rank-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .rank-item.first { border-color: var(--gold); background: linear-gradient(135deg, #1c4d3a, #123b2c); }
  .rank-badge { font-size: 22px; width: 34px; text-align: center; flex: none; }
  .rank-info { flex: 1; min-width: 0; }
  .rank-info .rname { font-weight: 700; font-size: 15px; }
  .rank-info .rmoney { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .rank-diff { text-align: right; font-weight: 800; font-size: 14px; flex: none; }
  .rank-diff.up { color: var(--up); }
  .rank-diff.down { color: var(--down); }
  .rank-diff.flat { color: var(--text-dim); }

  .footer-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }

  .confirm-text { font-size: 15px; line-height: 1.5; color: var(--text); margin-bottom: 4px; }
  .confirm-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     상수 / 스토리지
     ========================================================= */
  var STORAGE_KEY = 'hwatu_money_state_v1';
  var PRESET_MONEY = [1000, 5000, 10000, 50000, 100000];
  var QUICK_AMOUNTS = [1000, 5000, 10000];

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      // 저장 실패해도 화면 동작 자체는 계속되도록 무시한다
    }
  }

  function clearState() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  /* =========================================================
     상태
     ========================================================= */
  function defaultSetupState() {
    return {
      status: 'setup',
      settings: { playerCount: 4, startMoney: 10000 },
      setupNames: ['플레이어 1', '플레이어 2', '플레이어 3', '플레이어 4'],
      players: [],
      transactions: [],
      lastDelta: {} // playerId -> {dir:'up'|'down', ts}
    };
  }

  var state = loadState() || defaultSetupState();
  // 이전 버전 데이터 방어
  if (!state.setupNames) state.setupNames = [];
  // 증감 화살표는 이번 세션 안에서만 잠깐 보여주는 애니메이션 상태라
  // 새로고침 시점까지 남아있으면 안 되므로 항상 비운 채로 시작한다.
  state.lastDelta = {};

  var ui = {
    modal: null,       // 'transfer' | 'adjust' | 'history' | 'confirm' | null
    confirm: null,      // { text, sub, onConfirm, danger }
    transfer: { fromId: null, toId: null, amount: '' },
    adjust: { playerId: null, mode: 'plus', amount: '' },
    customMoney: false
  };

  /* =========================================================
     유틸
     ========================================================= */
  function fmt(n) {
    n = Math.round(Number(n) || 0);
    return n.toLocaleString('ko-KR');
  }

  function nowLabel() {
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  function findPlayer(id) {
    for (var i = 0; i < state.players.length; i++) {
      if (state.players[i].id === id) return state.players[i];
    }
    return null;
  }

  function leaderId() {
    if (state.players.length === 0) return null;
    var top = state.players[0];
    for (var i = 1; i < state.players.length; i++) {
      if (state.players[i].money > top.money) top = state.players[i];
    }
    // 동점이면 리더 표시 안 함
    var topCount = state.players.filter(function (p) { return p.money === top.money; }).length;
    return topCount === 1 ? top.id : null;
  }

  function pushTransaction(tx) {
    tx.id = 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    tx.time = nowLabel();
    state.transactions.unshift(tx);
  }

  function flashDelta(playerId, dir) {
    state.lastDelta[playerId] = { dir: dir, ts: Date.now() };
    setTimeout(function () {
      var cur = state.lastDelta[playerId];
      if (cur && Date.now() - cur.ts >= 1400) {
        delete state.lastDelta[playerId];
        render();
      }
    }, 1500);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* =========================================================
     렌더링
     ========================================================= */
  var app = document.getElementById('app');

  function render() {
    saveState();
    if (state.status === 'setup') {
      app.innerHTML = renderSetup();
      bindSetupEvents();
    } else if (state.status === 'playing') {
      app.innerHTML = renderGame();
      bindGameEvents();
      renderModal();
    } else if (state.status === 'ended') {
      app.innerHTML = renderResult();
      bindResultEvents();
    }
  }

  /* ---------- 설정 화면 ---------- */
  function renderSetup() {
    var s = state.settings;
    var count = s.playerCount;
    var names = state.setupNames;

    var chipRow = [2, 3, 4, 5, 6].map(function (n) {
      return '<button class="chip' + (n === count ? ' active' : '') + '" data-count="' + n + '">' + n + '명</button>';
    }).join('');

    var presetRow = PRESET_MONEY.map(function (m) {
      var active = !ui.customMoney && s.startMoney === m;
      return '<button class="chip' + (active ? ' active' : '') + '" data-preset="' + m + '">' + fmt(m) + '</button>';
    }).join('');

    var nameRows = '';
    for (var i = 0; i < count; i++) {
      var val = names[i] != null ? names[i] : ('플레이어 ' + (i + 1));
      nameRows += '<div class="player-name-row">' +
        '<div class="num">' + (i + 1) + '</div>' +
        '<input type="text" class="name-input" data-idx="' + i + '" maxlength="8" value="' + escapeHtml(val) + '" placeholder="플레이어 ' + (i + 1) + '" />' +
        '</div>';
    }

    return '' +
      '<div class="topbar"><div class="logo">🎴 화투 머니판</div></div>' +
      '<div class="card section">' +
        '<h2>인원수</h2>' +
        '<div class="chip-row">' + chipRow + '</div>' +
      '</div>' +
      '<div class="card section">' +
        '<h2>시작 머니</h2>' +
        '<div class="chip-row">' + presetRow + '</div>' +
        '<div class="field-label">직접 입력</div>' +
        '<input type="number" id="custom-money" inputmode="numeric" min="1" step="1" placeholder="예: 30000" value="' + (ui.customMoney ? s.startMoney : '') + '" />' +
      '</div>' +
      '<div class="card section">' +
        '<h2>플레이어 이름</h2>' +
        nameRows +
      '</div>' +
      (ui.setupError ? '<div class="error-text">' + escapeHtml(ui.setupError) + '</div>' : '') +
      '<button class="btn btn-primary btn-block" id="btn-start" style="margin-top:8px;">게임 시작</button>';
  }

  function bindSetupEvents() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-count]'), function (el) {
      el.addEventListener('click', function () {
        var n = Number(el.getAttribute('data-count'));
        state.settings.playerCount = n;
        for (var i = 0; i < n; i++) {
          if (!state.setupNames[i]) state.setupNames[i] = '플레이어 ' + (i + 1);
        }
        render();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (el) {
      el.addEventListener('click', function () {
        state.settings.startMoney = Number(el.getAttribute('data-preset'));
        ui.customMoney = false;
        render();
      });
    });

    var customInput = document.getElementById('custom-money');
    customInput.addEventListener('input', function () {
      ui.customMoney = true;
      var v = parseInt(customInput.value, 10);
      state.settings.startMoney = isNaN(v) ? 0 : v;
    });

    Array.prototype.forEach.call(document.querySelectorAll('.name-input'), function (el) {
      el.addEventListener('input', function () {
        var idx = Number(el.getAttribute('data-idx'));
        state.setupNames[idx] = el.value;
      });
    });

    document.getElementById('btn-start').addEventListener('click', startGame);
  }

  function startGame() {
    var s = state.settings;
    if (!s.startMoney || s.startMoney <= 0) {
      ui.setupError = '시작 머니를 1 이상으로 입력해주세요.';
      render();
      return;
    }
    ui.setupError = null;

    var players = [];
    for (var i = 0; i < s.playerCount; i++) {
      var rawName = (state.setupNames[i] || '').trim();
      players.push({
        id: 'p' + (i + 1),
        name: rawName || ('플레이어 ' + (i + 1)),
        startMoney: s.startMoney,
        money: s.startMoney
      });
    }

    state.players = players;
    state.transactions = [];
    state.lastDelta = {};
    state.status = 'playing';
    render();
  }

  /* ---------- 게임 화면 ---------- */
  function renderGame() {
    var leader = leaderId();
    var cards = state.players.map(function (p) {
      var delta = state.lastDelta[p.id];
      var deltaHtml = '';
      if (delta) {
        deltaHtml = '<div class="pdelta show ' + delta.dir + '">' + (delta.dir === 'up' ? '▲' : '▼') + '</div>';
      }
      return '<div class="player-card' + (p.id === leader ? ' leader' : '') + '">' +
        deltaHtml +
        '<div class="pname">' + (p.id === leader ? '👑 ' : '👤 ') + escapeHtml(p.name) + '</div>' +
        '<div class="pmoney">💰 ' + fmt(p.money) + '</div>' +
        '</div>';
    }).join('');

    var recent = state.transactions.slice(0, 5);
    var historyHtml = recent.length
      ? recent.map(renderHistoryItem).join('')
      : '<div class="empty-note">아직 거래 내역이 없습니다.</div>';

    return '' +
      '<div class="topbar">' +
        '<div class="logo">🎴 화투 머니판</div>' +
        '<div class="actions"><button class="btn btn-secondary btn-sm" id="btn-end-game">게임 종료</button></div>' +
      '</div>' +
      '<div class="player-grid section">' + cards + '</div>' +
      '<div class="action-grid">' +
        '<button class="btn btn-primary" id="btn-open-transfer">🔁 머니 이동</button>' +
        '<button class="btn btn-secondary" id="btn-open-adjust">✏️ 지급/차감</button>' +
      '</div>' +
      '<div class="card">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">' +
          '<h2 style="margin:0;">최근 거래</h2>' +
          (state.transactions.length > 5 ? '<button class="btn btn-ghost btn-sm" id="btn-open-history">전체 보기</button>' : '') +
        '</div>' +
        '<div class="history-preview">' + historyHtml + '</div>' +
      '</div>';
  }

  function renderHistoryItem(tx) {
    var sign = tx.amount >= 0 ? '+' : '';
    var cls = tx.amount >= 0 ? 'up' : 'down';
    return '<div class="history-item">' +
      '<div class="h-desc"><span class="h-time">[' + tx.time + ']</span><b>' + escapeHtml(tx.desc) + '</b></div>' +
      '<div class="h-amount" style="color:var(--' + cls + ')">' + sign + fmt(tx.amount) + '</div>' +
      '</div>';
  }

  function bindGameEvents() {
    document.getElementById('btn-end-game').addEventListener('click', function () {
      openConfirm({
        text: '게임을 종료하고 최종 결과를 확인할까요?',
        sub: '종료 후에도 "같은 설정으로 다시 시작"을 선택할 수 있어요.',
        onConfirm: endGame
      });
    });
    document.getElementById('btn-open-transfer').addEventListener('click', function () {
      ui.transfer = { fromId: state.players[0] ? state.players[0].id : null, toId: null, amount: '' };
      ui.formError = null;
      ui.modal = 'transfer';
      render();
    });
    document.getElementById('btn-open-adjust').addEventListener('click', function () {
      ui.adjust = { playerId: state.players[0] ? state.players[0].id : null, mode: 'plus', amount: '' };
      ui.formError = null;
      ui.modal = 'adjust';
      render();
    });
    var histBtn = document.getElementById('btn-open-history');
    if (histBtn) {
      histBtn.addEventListener('click', function () {
        ui.modal = 'history';
        render();
      });
    }
  }

  function endGame() {
    state.status = 'ended';
    ui.modal = null;
    render();
  }

  /* ---------- 모달: 머니 이동 / 지급차감 / 내역 / 확인 ---------- */
  function renderModal() {
    var existing = document.getElementById('modal-root');
    if (existing) existing.remove();
    if (!ui.modal) return;

    var wrap = document.createElement('div');
    wrap.id = 'modal-root';

    if (ui.modal === 'transfer') wrap.innerHTML = renderTransferModal();
    else if (ui.modal === 'adjust') wrap.innerHTML = renderAdjustModal();
    else if (ui.modal === 'history') wrap.innerHTML = renderHistoryModal();
    else if (ui.modal === 'confirm') wrap.innerHTML = renderConfirmModal();

    document.body.appendChild(wrap);
    bindModalEvents();
  }

  function renderTransferModal() {
    var t = ui.transfer;
    var fromOptions = state.players.map(function (p) {
      return '<button class="select-pill' + (p.id === t.fromId ? ' active' : '') + '" data-from="' + p.id + '">' + escapeHtml(p.name) + '</button>';
    }).join('');
    var toOptions = state.players.map(function (p) {
      var disabled = p.id === t.fromId;
      return '<button class="select-pill' + (p.id === t.toId ? ' active' : '') + '" ' + (disabled ? 'disabled' : '') + ' data-to="' + p.id + '">' + escapeHtml(p.name) + '</button>';
    }).join('');
    var quick = QUICK_AMOUNTS.map(function (a) {
      return '<button class="chip" data-quick-transfer="' + a + '">' + fmt(a) + '</button>';
    }).join('');

    var fromPlayer = findPlayer(t.fromId);
    var maxNote = fromPlayer ? ('보유 머니: ' + fmt(fromPlayer.money)) : '';

    return '' +
      '<div class="modal-backdrop" id="backdrop-transfer">' +
        '<div class="modal-sheet">' +
          '<div class="modal-head"><h2>🔁 머니 이동</h2><button class="close-x" data-close-modal>✕</button></div>' +
          '<div class="field-label">보내는 사람</div>' +
          '<div class="select-grid">' + fromOptions + '</div>' +
          '<div class="field-label">받는 사람</div>' +
          '<div class="select-grid">' + toOptions + '</div>' +
          '<div class="field-label">금액 <span style="color:var(--text-dim); font-weight:400;">(' + maxNote + ')</span></div>' +
          '<input type="number" id="transfer-amount" inputmode="numeric" min="1" step="1" placeholder="0" value="' + escapeHtml(t.amount) + '" />' +
          '<div class="amount-quick">' + quick + '</div>' +
          (ui.formError ? '<div class="error-text">' + escapeHtml(ui.formError) + '</div>' : '') +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" data-close-modal>취소</button>' +
            '<button class="btn btn-primary" id="btn-submit-transfer">전송</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderAdjustModal() {
    var a = ui.adjust;
    var playerOptions = state.players.map(function (p) {
      return '<button class="select-pill' + (p.id === a.playerId ? ' active' : '') + '" data-adjust-player="' + p.id + '">' + escapeHtml(p.name) + '</button>';
    }).join('');
    var quick = QUICK_AMOUNTS.map(function (v) {
      return '<button class="chip" data-quick-adjust="' + v + '">' + fmt(v) + '</button>';
    }).join('');

    return '' +
      '<div class="modal-backdrop" id="backdrop-adjust">' +
        '<div class="modal-sheet">' +
          '<div class="modal-head"><h2>✏️ 지급 / 차감</h2><button class="close-x" data-close-modal>✕</button></div>' +
          '<div class="field-label">플레이어</div>' +
          '<div class="select-grid">' + playerOptions + '</div>' +
          '<div class="field-label">유형</div>' +
          '<div class="toggle-row">' +
            '<button class="select-pill plus' + (a.mode === 'plus' ? ' active' : '') + '" data-adjust-mode="plus">＋ 지급</button>' +
            '<button class="select-pill minus' + (a.mode === 'minus' ? ' active' : '') + '" data-adjust-mode="minus">－ 차감</button>' +
          '</div>' +
          '<div class="field-label">금액</div>' +
          '<input type="number" id="adjust-amount" inputmode="numeric" min="1" step="1" placeholder="0" value="' + escapeHtml(a.amount) + '" />' +
          '<div class="amount-quick">' + quick + '</div>' +
          (ui.formError ? '<div class="error-text">' + escapeHtml(ui.formError) + '</div>' : '') +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" data-close-modal>취소</button>' +
            '<button class="btn btn-primary" id="btn-submit-adjust">확인</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderHistoryModal() {
    var items = state.transactions.length
      ? state.transactions.map(renderHistoryItem).join('')
      : '<div class="empty-note">아직 거래 내역이 없습니다.</div>';
    return '' +
      '<div class="modal-backdrop" id="backdrop-history">' +
        '<div class="modal-sheet">' +
          '<div class="modal-head"><h2>📜 전체 거래 내역</h2><button class="close-x" data-close-modal>✕</button></div>' +
          '<div class="history-preview">' + items + '</div>' +
        '</div>' +
      '</div>';
  }

  function renderConfirmModal() {
    var c = ui.confirm || {};
    return '' +
      '<div class="modal-backdrop center" id="backdrop-confirm">' +
        '<div class="modal-sheet">' +
          '<div class="confirm-text">' + escapeHtml(c.text || '') + '</div>' +
          (c.sub ? '<div class="confirm-sub">' + escapeHtml(c.sub) + '</div>' : '') +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" data-close-modal>취소</button>' +
            '<button class="btn ' + (c.danger ? 'btn-danger' : 'btn-primary') + '" id="btn-confirm-ok">확인</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function openConfirm(opts) {
    ui.confirm = opts;
    ui.modal = 'confirm';
    renderModal();
  }

  function closeModal() {
    ui.modal = null;
    ui.formError = null;
    var existing = document.getElementById('modal-root');
    if (existing) existing.remove();
  }

  function bindModalEvents() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-close-modal]'), function (el) {
      el.addEventListener('click', closeModal);
    });

    // 배경 클릭으로 닫기 (시트 내부 클릭은 무시)
    var backdrop = document.querySelector('.modal-backdrop');
    if (backdrop) {
      backdrop.addEventListener('click', function (e) {
        if (e.target === backdrop) closeModal();
      });
    }

    if (ui.modal === 'transfer') bindTransferEvents();
    else if (ui.modal === 'adjust') bindAdjustEvents();
    else if (ui.modal === 'confirm') bindConfirmEvents();
  }

  function bindTransferEvents() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-from]'), function (el) {
      el.addEventListener('click', function () {
        ui.transfer.fromId = el.getAttribute('data-from');
        if (ui.transfer.toId === ui.transfer.fromId) ui.transfer.toId = null;
        ui.formError = null;
        renderModal();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-to]'), function (el) {
      el.addEventListener('click', function () {
        if (el.disabled) return;
        ui.transfer.toId = el.getAttribute('data-to');
        ui.formError = null;
        renderModal();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-quick-transfer]'), function (el) {
      el.addEventListener('click', function () {
        ui.transfer.amount = el.getAttribute('data-quick-transfer');
        renderModal();
      });
    });
    var amountInput = document.getElementById('transfer-amount');
    amountInput.addEventListener('input', function () {
      ui.transfer.amount = amountInput.value;
    });
    document.getElementById('btn-submit-transfer').addEventListener('click', submitTransfer);
  }

  function submitTransfer() {
    var t = ui.transfer;
    var amount = parseInt(t.amount, 10);

    if (!t.fromId || !t.toId) {
      ui.formError = '보내는 사람과 받는 사람을 모두 선택해주세요.';
      renderModal();
      return;
    }
    if (t.fromId === t.toId) {
      ui.formError = '자기 자신에게는 전송할 수 없습니다.';
      renderModal();
      return;
    }
    if (!amount || amount <= 0) {
      ui.formError = '전송 금액은 0보다 커야 합니다.';
      renderModal();
      return;
    }
    var from = findPlayer(t.fromId);
    var to = findPlayer(t.toId);
    if (amount > from.money) {
      ui.formError = from.name + '님의 보유 머니(' + fmt(from.money) + ')보다 많이 보낼 수 없습니다.';
      renderModal();
      return;
    }

    from.money -= amount;
    to.money += amount;
    pushTransaction({ type: 'transfer', desc: from.name + ' → ' + to.name, amount: amount });
    flashDelta(from.id, 'down');
    flashDelta(to.id, 'up');

    closeModal();
    render();
  }

  function bindAdjustEvents() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-adjust-player]'), function (el) {
      el.addEventListener('click', function () {
        ui.adjust.playerId = el.getAttribute('data-adjust-player');
        renderModal();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-adjust-mode]'), function (el) {
      el.addEventListener('click', function () {
        ui.adjust.mode = el.getAttribute('data-adjust-mode');
        renderModal();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-quick-adjust]'), function (el) {
      el.addEventListener('click', function () {
        ui.adjust.amount = el.getAttribute('data-quick-adjust');
        renderModal();
      });
    });
    var amountInput = document.getElementById('adjust-amount');
    amountInput.addEventListener('input', function () {
      ui.adjust.amount = amountInput.value;
    });
    document.getElementById('btn-submit-adjust').addEventListener('click', function () {
      submitAdjust(false);
    });
  }

  function submitAdjust(forceNegative) {
    var a = ui.adjust;
    var amount = parseInt(a.amount, 10);

    if (!a.playerId) {
      ui.formError = '플레이어를 선택해주세요.';
      renderModal();
      return;
    }
    if (!amount || amount <= 0) {
      ui.formError = '금액은 0보다 커야 합니다.';
      renderModal();
      return;
    }

    var player = findPlayer(a.playerId);
    var signedAmount = a.mode === 'plus' ? amount : -amount;

    if (a.mode === 'minus' && !forceNegative && (player.money - amount) < 0) {
      openConfirm({
        text: player.name + '님의 머니가 마이너스(' + fmt(player.money - amount) + ')가 됩니다. 계속할까요?',
        sub: '보유 머니보다 많은 금액을 차감하려고 합니다.',
        danger: true,
        onConfirm: function () { submitAdjust(true); }
      });
      return;
    }

    player.money += signedAmount;
    pushTransaction({
      type: 'adjust',
      desc: player.name + ' ' + (a.mode === 'plus' ? '지급' : '차감'),
      amount: signedAmount
    });
    flashDelta(player.id, a.mode === 'plus' ? 'up' : 'down');

    closeModal();
    render();
  }

  function bindConfirmEvents() {
    document.getElementById('btn-confirm-ok').addEventListener('click', function () {
      var cb = ui.confirm && ui.confirm.onConfirm;
      ui.confirm = null;
      closeModal();
      if (cb) cb();
    });
  }

  /* ---------- 결과 화면 ---------- */
  function renderResult() {
    var sorted = state.players.slice().sort(function (a, b) { return b.money - a.money; });
    var medals = ['🥇', '🥈', '🥉'];

    var items = sorted.map(function (p, idx) {
      var diff = p.money - p.startMoney;
      var diffCls = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
      var diffText = diff > 0 ? ('+' + fmt(diff)) : (diff < 0 ? fmt(diff) : '±0');
      var badge = medals[idx] || ((idx + 1) + '위');
      return '<div class="rank-item' + (idx === 0 ? ' first' : '') + '">' +
        '<div class="rank-badge">' + badge + '</div>' +
        '<div class="rank-info">' +
          '<div class="rname">' + escapeHtml(p.name) + '</div>' +
          '<div class="rmoney">' + fmt(p.money) + '</div>' +
        '</div>' +
        '<div class="rank-diff ' + diffCls + '">' + diffText + '</div>' +
        '</div>';
    }).join('');

    return '' +
      '<div class="topbar"><div class="logo">🎴 화투 머니판</div></div>' +
      '<div class="result-title"><div class="trophy">🏆</div><h1>최종 결과</h1></div>' +
      '<div class="rank-list section">' + items + '</div>' +
      '<div class="footer-actions">' +
        '<button class="btn btn-primary btn-block" id="btn-restart-same">같은 설정으로 다시 시작</button>' +
        '<button class="btn btn-secondary btn-block" id="btn-new-game">새 게임</button>' +
      '</div>';
  }

  function bindResultEvents() {
    document.getElementById('btn-restart-same').addEventListener('click', function () {
      openConfirm({
        text: '같은 인원수와 시작 머니로 새로 시작할까요?',
        sub: '모든 플레이어의 머니가 시작 머니로 초기화되고, 거래 내역이 삭제됩니다.',
        onConfirm: restartSameSettings
      });
      renderModal();
    });
    document.getElementById('btn-new-game').addEventListener('click', function () {
      openConfirm({
        text: '새 게임을 시작할까요?',
        sub: '저장된 모든 데이터가 초기화됩니다.',
        danger: true,
        onConfirm: startNewGame
      });
      renderModal();
    });
  }

  function restartSameSettings() {
    state.players.forEach(function (p) { p.money = p.startMoney; });
    state.transactions = [];
    state.lastDelta = {};
    state.status = 'playing';
    render();
  }

  function startNewGame() {
    clearState();
    state = defaultSetupState();
    ui = {
      modal: null,
      confirm: null,
      transfer: { fromId: null, toId: null, amount: '' },
      adjust: { playerId: null, mode: 'plus', amount: '' },
      customMoney: false
    };
    render();
  }

  /* ---------- 초기 렌더 (결과/게임 화면 복귀 시 모달은 항상 닫힌 상태로 시작) ---------- */
  ui.modal = null;
  render();
})();
</script>
</body>
</html>
